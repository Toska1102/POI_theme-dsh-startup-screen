<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>THE MACHINE · POI Preview</title>
    <style>
      body {
        margin: 0;
        background: #11171c;
        color: #d5dfe3;
        font: 15px system-ui;
      }
      main {
        max-width: 760px;
        margin: 90px auto;
        padding: 24px;
      }
      h1 {
        font-size: 36px;
        letter-spacing: 0.1em;
      }
      #settings {
        margin-top: 36px;
      }
      button {
        cursor: pointer;
      }
      #replay {
        padding: 12px 20px;
        background: #f2e02a;
        border: 0;
        font: inherit;
      }
      #preview-note {
        line-height: 1.8;
        color: #94a8b3;
      }
    </style>
  </head>
  <body>
    <main>
      <p>DEEPSEEK HARNESS / INTERFACE READY</p>
      <h1>THE MACHINE</h1>
      <p id="preview-note">
        POI 启动动画预览。设置仅写入临时目录，不影响已安装 DSH。<br />首次点击或按键会解锁人声；动画结束后返回此页。
      </p>
      <button id="replay">重新播放</button>
      <div id="settings"></div>
    </main>
    <script defer src="/preview-react.js"></script>
    <script>
      document.getElementById('replay').onclick = () => window.__DSH_STARTUP_API__?.replay()
    </script>
  </body>
</html>
